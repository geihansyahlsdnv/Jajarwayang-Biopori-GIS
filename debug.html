<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biopori GIS - Debug Console</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #00ff00;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #ffff00; margin-top: 0; }
        .container {
            max-width: 1000px;
            background: #0a0a0a;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #00ff00;
        }
        .section {
            margin: 20px 0;
            padding: 10px;
            border-left: 3px solid #00ff00;
            padding-left: 15px;
        }
        .success { color: #00ff00; }
        .error { color: #ff0000; }
        .warning { color: #ffff00; }
        .info { color: #00ccff; }
        code {
            background: #333;
            padding: 2px 6px;
            border-radius: 3px;
            display: block;
            margin: 5px 0;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐛 Biopori GIS - Debug Console</h1>
        
        <div class="section">
            <h2>🌍 Environment Detection</h2>
            <div id="env-info"></div>
        </div>

        <div class="section">
            <h2>🔧 Environment Variables</h2>
            <div id="env-vars"></div>
        </div>

        <div class="section">
            <h2>📚 Library Check</h2>
            <div id="libraries"></div>
        </div>

        <div class="section">
            <h2>🔥 Firebase Config</h2>
            <div id="firebase"></div>
        </div>

        <div class="section">
            <h2>🗺️ Leaflet Test</h2>
            <div id="map" style="width: 100%; height: 400px; border: 2px solid #00ff00; margin-top: 10px;"></div>
            <div id="leaflet-status"></div>
        </div>
    </div>

    <script>
        // Detect environment
        const isProduction = !window.location.hostname.includes('localhost');
        const hostname = window.location.hostname;
        
        document.getElementById('env-info').innerHTML = `
            <code class="${isProduction ? 'success' : 'warning'}">
                Environment: ${isProduction ? 'PRODUCTION' : 'DEVELOPMENT'}<br>
                Hostname: ${hostname}<br>
                URL: ${window.location.href}
            </code>
        `;

        // Check import.meta.env
        document.getElementById('env-vars').innerHTML = `
            <p class="info">Note: import.meta.env hanya tersedia di module/build systems.</p>
            <p class="info">Berikut adalah variabel yang diharapkan:</p>
            <code>
                VITE_FIREBASE_API_KEY: [CHECKING...]<br>
                VITE_FIREBASE_AUTH_DOMAIN: [CHECKING...]<br>
                VITE_FIREBASE_PROJECT_ID: [CHECKING...]
            </code>
        `;

        // Check libraries
        let libHTML = '';
        
        // Leaflet
        if (window.L) {
            libHTML += `<code class="success">✓ Leaflet v${window.L.version} loaded</code>`;
        } else {
            libHTML += `<code class="error">✗ Leaflet NOT loaded - Trying to load from CDN...</code>`;
            // Try loading dynamically
            const leafletScript = document.createElement('script');
            leafletScript.src = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js';
            leafletScript.onload = () => {
                console.log('✓ Leaflet loaded dynamically');
            };
            leafletScript.onerror = () => {
                console.error('✗ Failed to load Leaflet');
            };
            document.head.appendChild(leafletScript);
        }

        // Turf
        if (window.turf) {
            libHTML += `<code class="success">✓ Turf.js loaded</code>`;
        } else {
            libHTML += `<code class="error">✗ Turf.js NOT loaded - Trying to load from CDN...</code>`;
            // Try loading dynamically
            const turfScript = document.createElement('script');
            turfScript.src = 'https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js';
            turfScript.onload = () => {
                console.log('✓ Turf.js loaded dynamically');
            };
            turfScript.onerror = () => {
                console.error('✗ Failed to load Turf.js');
            };
            document.head.appendChild(turfScript);
        }

        // Firebase
        if (window.firebase) {
            libHTML += `<code class="success">✓ Firebase SDK loaded</code>`;
        } else {
            libHTML += `<code class="warning">⚠ Firebase SDK NOT loaded (will try to load dynamically)</code>`;
        }

        document.getElementById('libraries').innerHTML = libHTML;

        // Firebase config test
        let firebaseHTML = '';
        try {
            // Try to load config
            firebaseHTML += `<code class="info">Attempting to load Firebase config...</code>`;
            
            // Since we're in a simple HTML file, show what we're looking for
            firebaseHTML += `
                <code>
                    Expected config keys:<br>
                    - apiKey<br>
                    - authDomain<br>
                    - databaseURL<br>
                    - projectId<br>
                    - storageBucket<br>
                    - messagingSenderId<br>
                    - appId
                </code>
            `;
        } catch (e) {
            firebaseHTML += `<code class="error">Error loading Firebase config: ${e.message}</code>`;
        }
        document.getElementById('firebase').innerHTML = firebaseHTML;

        // Test Leaflet map
        if (window.L) {
            try {
                const map = L.map('map').setView([-6.9507, 109.6180], 16);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors'
                }).addTo(map);
                
                L.circleMarker([-6.9507, 109.6180], {
                    radius: 10,
                    fillColor: '#2d6a4f',
                    color: '#fff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.9
                }).addTo(map).bindPopup('Test Marker - Jajarwayang Center');
                
                document.getElementById('leaflet-status').innerHTML = `
                    <code class="success">✓ Leaflet map initialized successfully!</code>
                `;
            } catch (e) {
                document.getElementById('leaflet-status').innerHTML = `
                    <code class="error">✗ Error initializing map: ${e.message}</code>
                `;
            }
        } else {
            document.getElementById('leaflet-status').innerHTML = `
                <code class="error">✗ Leaflet not available - cannot test map</code>
            `;
        }
    </script>

    <!-- Load libraries -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
</body>
</html>
